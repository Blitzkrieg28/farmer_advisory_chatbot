# Demo / App Configuration
# Used by app_gradio.py for web demo and speech integration

demo:
  whisper_model: "openai/whisper-small"
  nllb_model: "facebook/nllb-200-distilled-600M"
  tts_engine: "gtts"                     # "gtts" for multilingual text-to-speech
  supported_languages:
    en: "English"
    hi: "हिंदी (Hindi)"
    mr: "मराठी (Marathi)"
  
  # Real-mode paths (Google Colab / local deployed)
  vision_checkpoint: "checkpoints/vision/efficientnet_b0_plantvillage_seed42_best.pth"
  retriever_checkpoint: "checkpoints/retriever/e5_small_finetuned_seed42_best/"
  kb_path: "kb/chunks.jsonl"
  critic_config: "configs/critic.yaml"
  

  gradio:
    server_name: "0.0.0.0"
    server_port: 7860
    share: false                         # set to true in Colab for public tunneling
