# Critic / Verification Layer Configuration
# These thresholds are tuned on the VALIDATION set only.
critic:
  tau: 0.70              # top-1 probability threshold
  delta: 0.15            # margin between top-1 and top-2
  consistency_check: true # retrieved passage must match diagnosed disease

# Grid for threshold tuning (eval/tune_critic.py)
tuning_grid:
  tau_values: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]
  delta_values: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30]
