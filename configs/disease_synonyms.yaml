# Crop-level keywords (for chunk tagging when disease not identified but crop is)
crops:
  Tomato:
    en: ["tomato", "lycopersicon", "solanum lycopersicum"]
    hi: ["टमाटर"]    # TODO_VERIFY
    mr: ["टोमॅटो"]   # TODO_VERIFY
  Potato:
    en: ["potato", "solanum tuberosum"]
    hi: ["आलू", "बटाटा"]   # TODO_VERIFY
    mr: ["बटाटा", "आलू"]   # TODO_VERIFY
  Corn:
    en: ["corn", "maize", "zea mays"]
    hi: ["मक्का", "मकई", "भुट्टा"]   # TODO_VERIFY
    mr: ["मका", "भुट्टा"]              # TODO_VERIFY
  Grape:
    en: ["grape", "grapevine", "vitis vinifera", "vitis"]
    hi: ["अंगूर"]           # TODO_VERIFY
    mr: ["द्राक्ष"]          # TODO_VERIFY

# Dosage regex patterns used by ingest_pdfs.py has_dosage field
# These are patterns only; never fill in actual doses without a source document.
dosage_patterns:
  - "\\d+\\s*g/ha"
  - "\\d+\\.?\\d*\\s*kg/ha"
  - "\\d+\\.?\\d*\\s*ml/l"
  - "\\d+\\.?\\d*\\s*L/ha"
  - "\\d+\\s*ppm"
  - "PHI\\s*:?\\s*\\d+"
  - "\\d+\\s*days\\s*(before|after)\\s*harvest"
  - "\\d+\\s*WDH"              # weeks before harvest TODO_VERIFY abbreviation
  - "\\d+\\s*DAT"              # days after transplant TODO_VERIFY
  - "\\d+\\s*%\\s*(WP|SC|EC)"  # formulation concentrations

