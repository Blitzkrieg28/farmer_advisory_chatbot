# configs/disease_synonyms.yaml
# Disease synonym list for keyword tagging of PDF chunks.
# Used by data_prep/ingest_pdfs.py for crop_tags and disease_tags columns.
#
# ALL entries marked TODO_VERIFY — check each scientific name, common name,
# and Hindi/Marathi translation before submitting the final report.
# Sources to verify against: ICAR crop-protection circulars, CABI Crop Protection Compendium,
# and state agricultural university extension bulletins.
#
# Schema per entry:
#   class_id      : integer (matches class_mapping.json)
#   unified_name  : string (matches class_mapping.json)
#   crop          : string
#   disease       : string
#   scientific    : list of scientific names (TODO_VERIFY)
#   common_en     : list of English common names / abbreviations
#   common_hi     : list of Hindi names / transliterations (TODO_VERIFY)
#   common_mr     : list of Marathi names / transliterations (TODO_VERIFY)
#   is_healthy    : bool (true means no treatment chunks expected)

